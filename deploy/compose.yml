# Niro for self-hosting: the bot, the dashboard and API (one process), Postgres,
# Valkey and nightly backups. Optional: Caddy for HTTPS (profile "tls").
#
#   cp deploy/.env.example deploy/.env      # then fill it in
#   docker compose -f deploy/compose.yml up -d --build
#   docker compose -f deploy/compose.yml --profile tls up -d --build   # with Caddy
#
# The full guide is docs/self-host.md. Niro is built from this source tree;
# there is no prebuilt image for v0.1.0.
name: niro

services:
  niro:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${NIRO_VERSION:-self-hosted}
    image: niro:local
    command: ["all"]
    restart: unless-stopped
    env_file: .env
    environment:
      NIRO_ENV: production
      NIRO_LOG_FORMAT: json
      NIRO_DATABASE_URL: postgres://niro:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/niro?sslmode=disable
      NIRO_VALKEY_ADDR: valkey:6379
      NIRO_VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in deploy/.env}
      # Caddy, or a reverse proxy on this host, reaches Niro from this network.
      NIRO_TRUSTED_PROXIES: 172.31.250.0/24
    ports:
      # Only this machine can reach the dashboard directly; put a reverse proxy
      # with HTTPS in front (Caddy below, or your own).
      - "127.0.0.1:${NIRO_HTTP_PORT:-8080}:8080"
    # The ops port (9090: health checks and metrics) is not published.
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks: [niro]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: niro
      POSTGRES_USER: niro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niro -d niro"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [niro]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Valkey holds sessions and caches only; nothing in it needs a backup.
    # The password goes in a config file, not on the command line, so it
    # doesn't show in the process list.
    command: ["sh", "-c", "umask 077 && printf 'requirepass %s\\nsave \"\"\\nappendonly no\\n' \"$$VALKEY_PASSWORD\" > /tmp/valkey.conf && exec valkey-server /tmp/valkey.conf"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in deploy/.env}
      REDISCLI_AUTH: ${VALKEY_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [niro]

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: niro
      PGDATABASE: niro
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-3}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ./backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - backup-metrics:/metrics
    depends_on:
      postgres: { condition: service_healthy }
    networks: [niro]

  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      NIRO_DOMAIN: ${NIRO_DOMAIN:?set NIRO_DOMAIN in deploy/.env to use the tls profile}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [niro]
    networks: [niro]

networks:
  niro:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  postgres:
  backup-metrics:
  caddy-data:
  caddy-config:
