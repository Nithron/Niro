# Prometheus configuration for a Niro host (hosted or self-hosted).
# Scrapes Niro's ops port and node_exporter on the internal network only.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: niro
    static_configs:
      - targets: ["niro:9090"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
