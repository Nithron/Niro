name: Bug report
description: Something in Niro doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Don't file it here: see SECURITY.md for private reporting.
        Please never paste a bot token, client secret or server invite.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run /timeout …\n2. …"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Discord command or message, Dashboard, Self-hosted setup, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From /about, or the commit if you build from source
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, IDs you don't want public, and message contents.
      render: text
