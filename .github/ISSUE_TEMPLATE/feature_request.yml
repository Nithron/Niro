name: Feature request
description: An idea for Niro
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve for your server?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Niro to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you use today instead?
