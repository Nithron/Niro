openapi: 3.0.3
info:
  title: Niro API
  version: 0.1.0
  license:
    name: Nithron Community License (NCL) v1.0
    url: https://github.com/Nithron/Niro/blob/main/LICENSE
  description: |
    API behind the Niro dashboard. Authentication is a session cookie set by
    the Discord OAuth2 login flow (`/auth/login` → `/auth/callback`), which is
    not part of this spec. State-changing requests must come from the
    dashboard's origin (checked via the `Origin` header).

    Discord IDs (snowflakes) are strings, because they exceed JavaScript's
    safe integer range.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /me:
    get:
      operationId: getMe
      summary: The logged-in user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /guilds:
    get:
      operationId: listGuilds
      summary: Servers the user can manage
      description: |
        Servers where the user is the owner or has Administrator or Manage
        Server, with whether Niro is already in them. Cached for 60 seconds.
      responses:
        "200":
          description: Manageable servers, Niro-present first, then by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GuildSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /guilds/{guildId}:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: getGuild
      summary: One server the user can manage
      responses:
        "200":
          description: The server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuildSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /guilds/{guildId}/data:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    delete:
      operationId: deleteGuildData
      summary: Remove Niro from the server and delete all of its data now
      description: "Owner only. Niro leaves the server, then every setting, case, panel, ticket, transcript and Guardian record of the server is deleted at once, with no 30-day grace period. This cannot be undone."
      responses:
        "204": { description: Niro left and the data is deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BotError" }
  /guilds/{guildId}/modules:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: listGuildModules
      summary: Module states for a server
      responses:
        "200":
          description: Every module with its effective state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModuleState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/modules/{moduleId}:
    parameters:
      - $ref: "#/components/parameters/GuildId"
      - name: moduleId
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" }
    put:
      operationId: updateGuildModule
      summary: Enable or disable a module
      description: Applies immediately; the change is audited and broadcast to the bot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModuleUpdate" }
      responses:
        "200":
          description: The new state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/meta:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: getGuildMeta
      summary: Channels and roles (for pickers)
      description: Fetched live from Discord through the bot; cached for 30 seconds.
      responses:
        "200":
          description: Channels and roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuildMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
        "502": { $ref: "#/components/responses/BotError" }
  /guilds/{guildId}/settings/moderation:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: getModerationSettings
      summary: Moderation settings
      responses:
        "200":
          description: The settings (defaults if never saved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
    put:
      operationId: updateModerationSettings
      summary: Save moderation settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationSettings" }
      responses:
        "200":
          description: The saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/cases:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: listCases
      summary: Moderation cases, newest first
      parameters:
        - { name: user, in: query, required: false, schema: { $ref: "#/components/schemas/Snowflake" } }
        - { name: moderator, in: query, required: false, schema: { $ref: "#/components/schemas/Snowflake" } }
        - { name: action, in: query, required: false, schema: { $ref: "#/components/schemas/CaseAction" } }
        - name: before
          in: query
          required: false
          description: Only cases numbered below this (pagination cursor)
          schema: { type: integer, minimum: 1 }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of cases
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/cases/{caseNumber}:
    parameters:
      - $ref: "#/components/parameters/GuildId"
      - { name: caseNumber, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getCase
      summary: One case
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
    patch:
      operationId: updateCase
      summary: Change a case's reason
      description: Also updates the case's message in the moderation log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseUpdate" }
      responses:
        "200":
          description: The updated case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
        "502": { $ref: "#/components/responses/BotError" }
    delete:
      operationId: deleteCase
      summary: Delete a case from the history
      description: Soft delete; kept for the audit trail and marked in the moderation log.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
        "502": { $ref: "#/components/responses/BotError" }
  /guilds/{guildId}/automod/rules:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: listAutoModRules
      summary: The server's AutoMod rules (Discord's native AutoMod)
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutoModRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
        "502": { $ref: "#/components/responses/BotError" }
    post:
      operationId: createAutoModRule
      summary: Create a rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoModRule" }
      responses:
        "201":
          description: The created rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoModRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
        "502": { $ref: "#/components/responses/BotError" }
  /guilds/{guildId}/automod/rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/GuildId"
      - { name: ruleId, in: path, required: true, schema: { $ref: "#/components/schemas/Snowflake" } }
    put:
      operationId: updateAutoModRule
      summary: Replace a rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoModRule" }
      responses:
        "200":
          description: The updated rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoModRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
        "502": { $ref: "#/components/responses/BotError" }
    delete:
      operationId: deleteAutoModRule
      summary: Delete a rule
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
        "502": { $ref: "#/components/responses/BotError" }
  /guilds/{guildId}/settings/guardian:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: getGuardianSettings
      summary: Guardian settings
      responses:
        "200":
          description: The settings (defaults if never saved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
    put:
      operationId: updateGuardianSettings
      summary: Save Guardian settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianSettings" }
      responses:
        "200":
          description: The saved settings (domains normalized)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/settings/logging:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: getLoggingSettings
      summary: Server-log settings
      responses:
        "200":
          description: The settings (defaults if never saved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoggingSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
    put:
      operationId: updateLoggingSettings
      summary: Save server-log settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoggingSettings" }
      responses:
        "200":
          description: The saved settings (every event kind filled in)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoggingSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/role-panels:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: listRolePanels
      summary: Role panels
      responses:
        "200":
          description: The server's role panels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolePanelList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
    post:
      operationId: createRolePanel
      summary: Create a role panel and post it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolePanel" }
      responses:
        "201":
          description: The panel, as posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolePanel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/role-panels/{panelId}:
    parameters:
      - $ref: "#/components/parameters/GuildId"
      - name: panelId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      operationId: updateRolePanel
      summary: Save a role panel and update its message
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolePanel" }
      responses:
        "200":
          description: The panel, as posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolePanel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
    delete:
      operationId: deleteRolePanel
      summary: Delete a role panel and its message
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/settings/welcome:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: getWelcomeSettings
      summary: Welcome and goodbye settings
      responses:
        "200":
          description: The settings (defaults if never saved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WelcomeSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
    put:
      operationId: updateWelcomeSettings
      summary: Save welcome and goodbye settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WelcomeSettings" }
      responses:
        "200":
          description: The saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WelcomeSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/settings/tickets:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: getTicketSettings
      summary: Ticket settings
      responses:
        "200":
          description: The settings (defaults if never saved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
    put:
      operationId: updateTicketSettings
      summary: Save ticket settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketSettings" }
      responses:
        "200":
          description: The saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/ticket-panels:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: listTicketPanels
      summary: Ticket panels
      responses:
        "200":
          description: The server's ticket panels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPanelList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
    post:
      operationId: createTicketPanel
      summary: Create a ticket panel and post it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketPanel" }
      responses:
        "201":
          description: The panel, as posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPanel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/ticket-panels/{panelId}:
    parameters:
      - $ref: "#/components/parameters/GuildId"
      - name: panelId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      operationId: updateTicketPanel
      summary: Save a ticket panel and update its message
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketPanel" }
      responses:
        "200":
          description: The panel, as posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPanel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
    delete:
      operationId: deleteTicketPanel
      summary: Delete a ticket panel and its message (open tickets stay)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/tickets:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: listTickets
      summary: Tickets, newest first
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, claimed, closed] } }
        - { name: before, in: query, required: false, schema: { type: integer, minimum: 1 }, description: "Ticket number cursor" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of tickets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/tickets/{number}/transcript:
    parameters:
      - $ref: "#/components/parameters/GuildId"
      - name: number
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getTicketTranscript
      summary: A closed ticket's transcript, as a standalone page (sandboxed, no scripts)
      responses:
        "200":
          description: The transcript page
          headers:
            Content-Security-Policy:
              schema: { type: string }
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/guardian/events:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: listGuardianEvents
      summary: Guardian detections, newest first
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/GuardianStatus" } }
        - { name: user, in: query, required: false, schema: { $ref: "#/components/schemas/Snowflake" } }
        - name: before
          in: query
          required: false
          description: Only events with a lower ID (pagination cursor)
          schema: { type: integer, format: int64, minimum: 1 }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianEventList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/guardian/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/GuildId"
      - { name: eventId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: getGuardianEvent
      summary: One Guardian event
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
  /guilds/{guildId}/guardian/events/{eventId}/resolve:
    parameters:
      - $ref: "#/components/parameters/GuildId"
      - { name: eventId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      operationId: resolveGuardianEvent
      summary: Restore, ban or keep a quarantined member
      description: The same as the buttons on the Discord alert; the alert is updated too.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianResolve" }
      responses:
        "200":
          description: The updated event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
        "502": { $ref: "#/components/responses/BotError" }
  /guilds/{guildId}/guardian/raid:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: getRaidStatus
      summary: Whether raid mode is on
      responses:
        "200":
          description: Raid mode status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaidStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
    post:
      operationId: startRaidMode
      summary: Turn raid mode on now
      responses:
        "200":
          description: Raid mode status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaidStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
        "502": { $ref: "#/components/responses/BotError" }
    delete:
      operationId: endRaidMode
      summary: Turn raid mode off and undo its changes
      responses:
        "200":
          description: Raid mode status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaidStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
        "502": { $ref: "#/components/responses/BotError" }
  /guilds/{guildId}/guardian/audit:
    parameters:
      - $ref: "#/components/parameters/GuildId"
    get:
      operationId: getPermissionAudit
      summary: Audit the server for dangerous permissions and settings
      description: Read-only. Runs on the bot, which reads roles, integrations and webhooks.
      responses:
        "200":
          description: Findings, most severe first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BotNotInGuild" }
        "502": { $ref: "#/components/responses/BotError" }
  /automod/presets:
    get:
      operationId: listAutoModPresets
      summary: Ready-made AutoMod rules
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutoModPreset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /invite:
    get:
      operationId: getInvite
      summary: Link to add Niro to a server
      security: []
      parameters:
        - name: guildId
          in: query
          required: false
          description: Preselect this server in Discord's install screen
          schema: { $ref: "#/components/schemas/Snowflake" }
      responses:
        "200":
          description: The install URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "400": { $ref: "#/components/responses/BadRequest" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: niro_session
  parameters:
    GuildId:
      name: guildId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Snowflake" }
  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not logged in, or the session expired
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The user cannot manage this server
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BotError:
      description: The bot could not complete the request (offline, or Discord refused it)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BotNotInGuild:
      description: Niro is not in this server yet
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Snowflake:
      type: string
      pattern: "^[0-9]{1,20}$"
      example: "1234567890123456789"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code
          enum: [bad_request, unauthorized, forbidden, not_found, bot_not_in_guild, module_always_on, bot_unavailable, discord_error, rate_limited, internal]
        message: { type: string }
    User:
      type: object
      required: [id, username, avatarUrl]
      properties:
        id: { $ref: "#/components/schemas/Snowflake" }
        username: { type: string }
        globalName: { type: string, description: "Display name, if set" }
        avatarUrl: { type: string, format: uri }
    GuildSummary:
      type: object
      required: [id, name, botPresent, owner]
      properties:
        id: { $ref: "#/components/schemas/Snowflake" }
        name: { type: string }
        iconUrl: { type: string, format: uri }
        botPresent: { type: boolean, description: Niro is in this server }
        owner: { type: boolean, description: The user owns this server }
    ModuleState:
      type: object
      required: [id, enabled, alwaysOn, version]
      properties:
        id: { type: string, example: logging }
        enabled: { type: boolean }
        alwaysOn: { type: boolean, description: Cannot be disabled }
        version: { type: integer, format: int64, description: 0 if the module was never changed }
        updatedAt: { type: string, format: date-time }
    ModuleUpdate:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
    GuildMeta:
      type: object
      required: [channels, roles]
      properties:
        channels:
          type: array
          items:
            type: object
            required: [id, name, type, position]
            properties:
              id: { $ref: "#/components/schemas/Snowflake" }
              name: { type: string }
              type: { type: string, enum: [text, announcement, voice, forum, category, other] }
              parentId: { $ref: "#/components/schemas/Snowflake" }
              position: { type: integer }
        roles:
          type: array
          items:
            type: object
            required: [id, name, color, position, managed, dangerous]
            properties:
              id: { $ref: "#/components/schemas/Snowflake" }
              name: { type: string }
              color: { type: integer }
              position: { type: integer }
              managed: { type: boolean, description: "Bot or integration role (can't be assigned)" }
              dangerous: { type: boolean, description: "Grants a dangerous permission, so Niro won't hand it out" }
    ModerationSettings:
      type: object
      required: [logChannelId, dmUsers, requireReason]
      additionalProperties: false
      properties:
        logChannelId:
          type: string
          pattern: "^[0-9]{1,20}$"
          description: Channel for case logs; "0" disables the log
        dmUsers: { type: boolean, description: "DM users about warnings, timeouts, kicks and bans" }
        requireReason: { type: boolean }
    CaseAction:
      type: string
      enum: [warn, timeout, untimeout, kick, ban, unban, note, purge, quarantine, unquarantine]
    Case:
      type: object
      required: [number, action, targetName, moderatorId, moderatorName, reason, source, dmSent, createdAt, updatedAt]
      properties:
        number: { type: integer }
        action: { $ref: "#/components/schemas/CaseAction" }
        targetId: { $ref: "#/components/schemas/Snowflake" }
        targetName: { type: string }
        moderatorId: { $ref: "#/components/schemas/Snowflake" }
        moderatorName: { type: string }
        reason: { type: string }
        durationSeconds: { type: integer }
        expiresAt: { type: string, format: date-time }
        source: { type: string, enum: [manual, automod, guardian, dashboard, system] }
        dmSent: { type: boolean }
        channelId: { $ref: "#/components/schemas/Snowflake" }
        deletedMessages: { type: integer, description: "Purges: messages deleted; bans: seconds of history deleted" }
        temporary: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CaseList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Case" }
        total: { type: integer, description: Matching cases in total }
        nextBefore: { type: integer, description: "Cursor for the next page, absent on the last page" }
    CaseUpdate:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 512 }
    AutoModRule:
      type: object
      required: [name, enabled, trigger, blockMessage]
      properties:
        id: { $ref: "#/components/schemas/Snowflake" }
        name: { type: string, maxLength: 100 }
        enabled: { type: boolean }
        trigger: { type: string, enum: [keyword, spam, keyword_preset, mention_spam] }
        keywords: { type: array, items: { type: string } }
        regexPatterns: { type: array, items: { type: string } }
        allowList: { type: array, items: { type: string } }
        presets: { type: array, items: { type: string, enum: [profanity, sexual_content, slurs] } }
        mentionLimit: { type: integer }
        mentionRaidProtection: { type: boolean }
        blockMessage: { type: boolean }
        customMessage: { type: string, maxLength: 150 }
        alertChannelId: { $ref: "#/components/schemas/Snowflake" }
        timeoutSeconds: { type: integer }
        exemptRoleIds: { type: array, items: { $ref: "#/components/schemas/Snowflake" } }
        exemptChannelIds: { type: array, items: { $ref: "#/components/schemas/Snowflake" } }
        createdByBot: { type: boolean, readOnly: true }
    AutoModPreset:
      type: object
      required: [id, rule]
      properties:
        id: { type: string }
        rule: { $ref: "#/components/schemas/AutoModRule" }
    GuardianSettings:
      type: object
      additionalProperties: false
      required: [mode, alertChannelId, exemptRoleIds, burstEnabled, burstChannels, burstWindowSeconds, quietDays,
        scamLinksEnabled, allowDomains, denyDomains, quarantineMode, quarantineRoleId, quarantineHours, dmUser,
        raidEnabled, raidJoins, raidWindowSeconds, raidDurationMinutes, raidPauseInvites, raidRaiseVerification,
        raidSlowmodeSeconds, minAccountAgeHours, accountAgeAction, verifyRoleId, verifyMinAccountAgeHours]
      properties:
        mode: { type: string, enum: [enforce, monitor], description: "monitor only alerts, never acts" }
        alertChannelId: { type: string, pattern: "^[0-9]{1,20}$", description: '"0" uses the moderation log channel' }
        exemptRoleIds: { type: array, maxItems: 25, items: { $ref: "#/components/schemas/Snowflake" } }
        burstEnabled: { type: boolean }
        burstChannels: { type: integer, minimum: 2, maximum: 10 }
        burstWindowSeconds: { type: integer, minimum: 10, maximum: 600 }
        quietDays: { type: integer, minimum: 0, maximum: 365, description: 0 turns the quiet-account signal off }
        scamLinksEnabled: { type: boolean }
        allowDomains: { type: array, maxItems: 200, items: { type: string, maxLength: 253 } }
        denyDomains: { type: array, maxItems: 200, items: { type: string, maxLength: 253 } }
        quarantineMode: { type: string, enum: [timeout, role] }
        quarantineRoleId: { type: string, pattern: "^[0-9]{1,20}$", description: '"0" when not using role mode' }
        quarantineHours: { type: integer, minimum: 1, maximum: 672 }
        dmUser: { type: boolean, description: Send quarantined members recovery steps }
        raidEnabled: { type: boolean }
        raidJoins: { type: integer, minimum: 3, maximum: 200 }
        raidWindowSeconds: { type: integer, minimum: 5, maximum: 600 }
        raidDurationMinutes: { type: integer, minimum: 5, maximum: 1440 }
        raidPauseInvites: { type: boolean }
        raidRaiseVerification: { type: boolean }
        raidSlowmodeSeconds: { type: integer, minimum: 0, maximum: 21600 }
        minAccountAgeHours: { type: integer, minimum: 0, maximum: 8760, description: 0 turns the account-age gate off }
        accountAgeAction: { type: string, enum: [alert, kick, quarantine] }
        verifyRoleId: { type: string, pattern: "^[0-9]{1,20}$", description: '"0" when the verification gate is not set up' }
        verifyMinAccountAgeHours: { type: integer, minimum: 0, maximum: 8760 }
    MessageDocument:
      type: object
      additionalProperties: false
      description: A message designed in the dashboard (Components V2). Validated against Discord's limits on save.
      required: [version, blocks]
      properties:
        version: { type: integer, minimum: 1, maximum: 1 }
        accentColor: { type: integer, minimum: 0, maximum: 16777215, description: "Colour bar as 0xRRGGBB; absent for none" }
        blocks: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/MessageBlock" } }
    MessageBlock:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [text, section, gallery, separator, links] }
        text: { type: string, maxLength: 4000, description: "Markdown; text and section blocks. Variables: {user}, {user.name}, {user.id}, {server}, {memberCount}, {channel}" }
        thumbnail: { type: string, maxLength: 2048, description: "https image URL; section blocks" }
        images:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [url]
            properties:
              url: { type: string, maxLength: 2048 }
              description: { type: string, maxLength: 1024 }
        divider: { type: boolean }
        large: { type: boolean }
        links:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [label, url]
            properties:
              label: { type: string, maxLength: 80 }
              url: { type: string, maxLength: 2048 }
              emoji: { type: string, maxLength: 32 }
    RolePanelRole:
      type: object
      additionalProperties: false
      required: [roleId, label]
      properties:
        roleId: { $ref: "#/components/schemas/Snowflake" }
        label: { type: string, maxLength: 80 }
        emoji: { type: string, maxLength: 32 }
        description: { type: string, maxLength: 100, description: Select menus only }
    RolePanel:
      type: object
      additionalProperties: false
      required: [name, channelId, message, style, mode, roles, maxRoles, requiredRoleId]
      properties:
        id: { type: integer, format: int64, description: Ignored on input }
        name: { type: string, minLength: 1, maxLength: 100 }
        channelId: { $ref: "#/components/schemas/Snowflake" }
        messageId: { type: string, pattern: "^[0-9]{1,20}$", description: "The posted message (ignored on input)" }
        message: { $ref: "#/components/schemas/MessageDocument" }
        style: { type: string, enum: [buttons, select] }
        mode: { type: string, enum: [toggle, unique, verify] }
        roles: { type: array, minItems: 1, maxItems: 25, items: { $ref: "#/components/schemas/RolePanelRole" } }
        maxRoles: { type: integer, minimum: 0, maximum: 25, description: "Toggle mode: most roles a member may hold from the panel (0 = no limit)" }
        requiredRoleId: { type: string, pattern: "^[0-9]{1,20}$", description: '"0" when anyone may use the panel' }
        updatedAt: { type: string, format: date-time }
    RolePanelList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RolePanel" } }
    WelcomeSettings:
      type: object
      additionalProperties: false
      required: [welcomeEnabled, welcomeChannelId, welcomeMessage, pingMember, dmEnabled, dmMessage, goodbyeEnabled, goodbyeChannelId, goodbyeMessage, autoRoleIds]
      properties:
        welcomeEnabled: { type: boolean }
        welcomeChannelId: { type: string, pattern: "^[0-9]{1,20}$" }
        welcomeMessage: { $ref: "#/components/schemas/MessageDocument" }
        pingMember: { type: boolean, description: "Let the welcome message notify the new member (and only them)" }
        dmEnabled: { type: boolean }
        dmMessage: { $ref: "#/components/schemas/MessageDocument" }
        goodbyeEnabled: { type: boolean }
        goodbyeChannelId: { type: string, pattern: "^[0-9]{1,20}$" }
        goodbyeMessage: { $ref: "#/components/schemas/MessageDocument" }
        autoRoleIds: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Snowflake" } }
    TicketSettings:
      type: object
      additionalProperties: false
      required: [retentionDays, transcriptChannelId]
      properties:
        retentionDays: { type: integer, minimum: 1, maximum: 365, description: How long transcripts are kept }
        transcriptChannelId: { type: string, pattern: "^[0-9]{1,20}$", description: '"0" for none' }
    TicketQuestion:
      type: object
      additionalProperties: false
      required: [label, long, required]
      properties:
        label: { type: string, maxLength: 45 }
        placeholder: { type: string, maxLength: 100 }
        long: { type: boolean }
        required: { type: boolean }
    TicketCategory:
      type: object
      additionalProperties: false
      required: [label, mode, parentId, staffRoleIds, questions, opening, maxOpen]
      properties:
        id: { type: string, maxLength: 16, description: "Kept across edits; empty for a new category" }
        label: { type: string, maxLength: 80 }
        emoji: { type: string, maxLength: 32 }
        mode: { type: string, enum: [thread, channel] }
        parentId: { type: string, pattern: "^[0-9]{1,20}$", description: 'Channel mode: the category new channels go in; "0" for none' }
        staffRoleIds: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/Snowflake" } }
        questions: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/TicketQuestion" } }
        opening: { $ref: "#/components/schemas/MessageDocument" }
        maxOpen: { type: integer, minimum: 1, maximum: 5 }
    TicketPanel:
      type: object
      additionalProperties: false
      required: [name, channelId, message, categories]
      properties:
        id: { type: integer, format: int64, description: Ignored on input }
        name: { type: string, minLength: 1, maxLength: 100 }
        channelId: { $ref: "#/components/schemas/Snowflake" }
        messageId: { type: string, pattern: "^[0-9]{1,20}$", description: "The posted message (ignored on input)" }
        message: { $ref: "#/components/schemas/MessageDocument" }
        categories: { type: array, minItems: 1, maxItems: 5, items: { $ref: "#/components/schemas/TicketCategory" } }
        updatedAt: { type: string, format: date-time }
    TicketPanelList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TicketPanel" } }
    Ticket:
      type: object
      required: [number, categoryLabel, mode, openerId, openerName, status, createdAt, hasTranscript]
      properties:
        number: { type: integer }
        categoryLabel: { type: string }
        mode: { type: string, enum: [thread, channel] }
        channelId: { $ref: "#/components/schemas/Snowflake" }
        openerId: { $ref: "#/components/schemas/Snowflake" }
        openerName: { type: string }
        claimedByName: { type: string }
        status: { type: string, enum: [open, claimed, closed] }
        closeReason: { type: string }
        closedByName: { type: string }
        closedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        hasTranscript: { type: boolean }
    TicketList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
        nextBefore: { type: integer, description: "Cursor for the next page, absent on the last page" }
    LoggingChannels:
      type: object
      additionalProperties: false
      description: The log channel per category; "0" uses the default channel.
      required: [messages, members, moderation, server, voice, automod, guardian]
      properties:
        messages: { $ref: "#/components/schemas/Snowflake" }
        members: { $ref: "#/components/schemas/Snowflake" }
        moderation: { $ref: "#/components/schemas/Snowflake" }
        server: { $ref: "#/components/schemas/Snowflake" }
        voice: { $ref: "#/components/schemas/Snowflake" }
        automod: { $ref: "#/components/schemas/Snowflake" }
        guardian: { $ref: "#/components/schemas/Snowflake" }
    LoggingSettings:
      type: object
      additionalProperties: false
      required: [defaultChannelId, channels, events, ignoreChannelIds, ignoreRoleIds, ignoreBots, noMessageContent]
      properties:
        defaultChannelId: { $ref: "#/components/schemas/Snowflake" }
        channels: { $ref: "#/components/schemas/LoggingChannels" }
        events:
          type: object
          description: Event kind (message_edit, member_join…) to on/off. Kinds left out keep their default.
          additionalProperties: { type: boolean }
        ignoreChannelIds: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/Snowflake" } }
        ignoreRoleIds: { type: array, maxItems: 25, items: { $ref: "#/components/schemas/Snowflake" } }
        ignoreBots: { type: boolean, description: Skip messages and voice activity of bots (bot joins and leaves are always logged) }
        noMessageContent: { type: boolean, description: Never cache or show message text }
    GuardianStatus:
      type: string
      enum: [open, kept, restored, banned, info, active, ended]
    GuardianSignal:
      type: object
      required: [kind, weight]
      properties:
        kind: { type: string, enum: [burst, blocked_domain, denied_domain, lookalike_domain, masked_link, scam_template, quiet_account, new_account, join_flood, manual] }
        detail: { type: string }
        weight: { type: integer }
    GuardianEvent:
      type: object
      required: [id, kind, signals, score, response, status, channelIds, deletedMessages, domains, problems, monitor, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { $ref: "#/components/schemas/Snowflake" }
        userName: { type: string }
        kind: { type: string, enum: [compromised, scam, raid, account_age] }
        signals: { type: array, items: { $ref: "#/components/schemas/GuardianSignal" } }
        score: { type: integer }
        response: { type: string, enum: [alert, delete, quarantine, kick, raid_mode] }
        status: { $ref: "#/components/schemas/GuardianStatus" }
        caseNumber: { type: integer }
        channelIds: { type: array, items: { $ref: "#/components/schemas/Snowflake" } }
        deletedMessages: { type: integer }
        domains: { type: array, items: { type: string } }
        joins: { type: integer }
        accountAge: { type: string }
        problems: { type: array, items: { type: string } }
        monitor: { type: boolean, description: Monitor mode; no action was taken }
        resolvedByName: { type: string }
        resolvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    GuardianEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GuardianEvent" }
        nextBefore: { type: integer, format: int64, description: "Cursor for the next page, absent on the last page" }
    GuardianResolve:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { type: string, enum: [restore, ban, keep] }
    RaidStatus:
      type: object
      required: [active, problems]
      properties:
        active: { type: boolean }
        startedAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        manual: { type: boolean }
        joins: { type: integer }
        problems: { type: array, items: { type: string } }
    AuditFinding:
      type: object
      required: [severity, code]
      properties:
        severity: { type: string, enum: [critical, high, medium, info] }
        code: { type: string, enum: [everyone_dangerous, role_admin, role_dangerous, bot_admin, bot_dangerous, webhooks, verification_none, verification_low, no_moderator_mfa, self_admin] }
        subjectId: { $ref: "#/components/schemas/Snowflake" }
        subject: { type: string }
        permissions: { type: array, items: { type: string } }
        count: { type: integer, description: "Members with the role (-1 if unknown) or number of webhooks" }
        channelIds: { type: array, items: { $ref: "#/components/schemas/Snowflake" } }
    AuditResult:
      type: object
      required: [findings, webhooksChecked]
      properties:
        findings:
          type: array
          items: { $ref: "#/components/schemas/AuditFinding" }
        webhooksChecked: { type: boolean, description: False when Niro lacks Manage Webhooks }
    Invite:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
