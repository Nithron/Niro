"guardian.dm.title" = "Your account may be compromised"
"guardian.dm.body" = """
Niro, the security bot in **{{.Server}}**, saw messages from your account that look like a scam, so you have been temporarily restricted there and the messages were removed.

If you didn't send them, someone else probably has access to your account:
1. Change your Discord password.
2. Turn on two-factor authentication (User Settings → My Account).
3. In User Settings → Devices, log out of every device you don't recognise.
4. In User Settings → Authorized Apps, remove anything you don't recognise.
5. If you recently ran a file or "game" someone sent you, scan your computer for malware.

Then contact the moderators of **{{.Server}}**: they can restore your access."""

